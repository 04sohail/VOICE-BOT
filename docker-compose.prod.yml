services:
  voice-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-bot-prod
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
