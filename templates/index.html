<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="blur-blob blob-1"></div>
        <div class="blur-blob blob-2"></div>
    </div>

    <div class="app-container">
        <header class="glass-panel">
            <div class="logo">
                <div class="logo-mark"></div>
                <h1>Dr. Smith's Clinic</h1>
            </div>
            <div class="status-indicator">
                <div id="connection-dot" class="dot disconnected"></div>
                <span id="connection-status">Disconnected</span>
            </div>
        </header>
        
        <main class="chat-wrapper glass-panel">
            <div class="chat-container" id="chat-container">
                <div class="welcome-message">
                    <h2>Dr. Smith's Dentistry</h2>
                    <p>Click "Call Receptionist" to book your appointment. You can speak naturally and interrupt at any time!</p>
                </div>
            </div>
        </main>
        
        <div class="controls-container">
            <div class="orb-container" id="orb-container">
                <div class="orb" id="orb"></div>
                <div class="orb-glow" id="orb-glow"></div>
                <div class="status-text" id="ai-status">Idle</div>
            </div>
            
            <div class="action-buttons">
                <button id="mic-btn" class="mic-btn glass-btn call-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="phone-icon">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span id="mic-text">Call Receptionist</span>
                </button>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
